    --text-dim:#a89c85;
    --text-faint:#6e6353;
    --diamond:#5db3ef;
    --green:#3bcf7a;
    --red:#e05a5a;
    --radius:20px;

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;}
  body{

      radial-gradient(circle at 50% -10%, rgba(240,185,61,0.10), transparent 45%),

  h1,h2,h3,.font-display{font-family:'Sora',sans-serif;}
  #app{

  /* ---------- Header ---------- */

  .avatar{
    width:42px;height:42px;border-radius:50%;

    display:flex;align-items:center;justify-content:center;font-size:18px;

  .user-meta{min-width:0;}

  .user-meta .handle{font-size:14px;font-weight:700;color:var(--text); white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill{

    white-space:nowrap;

  .pill .plus{

    color:#241a04;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;
    margin-left:2px; cursor:pointer;
  }
  .pill.coin{color:var(--gold);}
  .pill.diamond{color:var(--diamond);}

  /* ---------- Panel / cards ---------- */
  .panel{
    background:var(--card);

    border-radius:var(--radius);
    margin:6px 16px 12px;

  }
  .content{flex:1; overflow-y:auto; padding-bottom:96px; -webkit-overflow-scrolling:touch;}
  .content::-webkit-scrollbar{display:none;}

  .segmented{display:flex; gap:0; padding:6px; background:#0f0c07; margin:6px 16px; border-radius:16px; border:1px solid var(--border);}
  .segmented button{

    letter-spacing:0.5px; padding:11px 6px; border-radius:12px; cursor:pointer; font-family:'Manrope';
    transition:all .15s ease;

  .segmented button.active{background:var(--gold); color:#241a04;}

    padding:12px 14px; margin:0 16px 10px;

  .row-card:hover{border-color:var(--border-strong);}

  .row-title{font-weight:700; font-size:14.5px; color:var(--text); display:flex; align-items:center; gap:5px;}
  .row-sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .row-reward{font-size:12.5px; color:var(--diamond); font-weight:800; margin-top:4px; display:flex; align-items:center; gap:4px;}
  .row-action{flex-shrink:0;}

  .section-title{padding:14px 16px 6px; font-size:11px; letter-spacing:1.5px; color:var(--text-faint); font-weight:800;}

  .subheader .title{font-size:17px; font-weight:800; text-align:right; font-family:'Sora';}

  .field-label{font-size:10.5px; letter-spacing:1.2px; color:var(--text-faint); font-weight:800; padding:14px 16px 6px;}

  .podium .p .rank{position:absolute; top:-8px; left:-8px; width:22px;height:22px; border-radius:50%; background:var(--card); border:1px solid var(--border-strong); font-size:11px; display:flex;align-items:center;justify-content:center; font-weight:900;}

  .podium .p .score{font-size:11px; color:var(--gold); font-weight:800;}

  .list-row{display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .rank-num{width:20px; font-size:13px; color:var(--text-faint); font-weight:800;}
  .list-av{width:34px;height:34px;border-radius:10px; display:flex;align-items:center;justify-content:center;font-weight:800; font-size:14px; font-family:'Sora'; flex-shrink:0;}

  .list-name{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .list-tag{font-size:10px; color:var(--text-faint); font-weight:700; letter-spacing:0.4px;}
  .list-score{font-size:13.5px; font-weight:800; color:var(--gold);}

  /* modal */
  .modal-bg{position:absolute; inset:0; background:rgba(0,0,0,0.55); backdrop-filter:blur(2px); display:flex; align-items:flex-end; z-index:50;}
  .modal-sheet{width:100%; background:var(--card); border-top:1px solid var(--border-strong); border-radius:20px 20px 0 0; padding:18px; animation:slideUp .2s ease;}

  .modal-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .modal-title{font-size:17px; font-weight:800; font-family:'Sora';}
  .modal-sub{font-size:12px; color:var(--text-dim); margin-top:3px;}
  .modal-close{width:30px;height:30px;border-radius:50%;background:var(--card-2); border:1px solid var(--border); color:var(--text); display:flex;align-items:center;justify-content:center; cursor:pointer;}

  .toast{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);

  @keyframes toastIn{from{opacity:0; transform:translate(-50%,-10px);} to{opacity:1; transform:translate(-50%,0);}}

  .info-line{display:flex; justify-content:space-between; margin:0 16px 12px; font-size:12.5px;}
  .info-line .l{color:var(--text-faint); font-weight:700;}
  .info-line .v{font-weight:800;}
  .divider{height:1px; background:var(--border); margin:6px 16px 12px;}

  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border);}
  .toggle-row:last-child{border-bottom:none;}
  .switch{width:44px;height:26px;border-radius:100px; background:var(--card-2); border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0;}
  .switch.on{background:var(--gold);}
  .switch .knob{position:absolute; top:2px; left:2px; width:20px;height:20px;border-radius:50%; background:#fff; transition:left .15s ease;}
  .switch.on .knob{left:20px; background:#241a04;}

  .lock-row{opacity:0.5;}
</style>
</head>

/* ============ PERSISTENCE ============ */
const STORAGE_KEY = 'yumi_coin_save_v1';
const CLOUD_KEY = 'yumi_core_v1';
function getCloudStorage(){
  const tg = window.Telegram && window.Telegram.WebApp;
  return (tg && tg.CloudStorage) ? tg.CloudStorage : null;
}
function saveState(){
  try{
    const data = {
      coins: state.coins,
      diamonds: state.diamonds,
      energy: state.energy,
      referralCode: state.referralCode,
      taskList: state.taskList,
      orders: state.orders,
      p2pListings: state.p2pListings,
      referralStats: state.referralStats,
      balanceUZS: state.balanceUZS,
      depositRequests: state.depositRequests,
      dailyBonusCode: state.dailyBonusCode,
      dailyBonusReward: state.dailyBonusReward,
      wheelRotation: state.wheelRotation,
      auctions: state.auctions,
      ownedSkins: state.ownedSkins,
      selectedSkin: state.selectedSkin,
      myUsername: state.myUsername,
      onboardingDone: state.onboardingDone,
      referredByCode: state.referredByCode,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e){ /* storage unavailable — progress will only last this session */ }

  // Telegram'ning o'z bulutli xotirasiga ham eng muhim qismini yozib qo'yamiz —
  // bu localStorage tozalanib qolsa ham (ba'zi qurilmalarda shunday bo'ladi) yo'qolmaydi.
  try{
    const cloud = getCloudStorage();
    if(cloud){
      const coreData = {
        coins: state.coins,
        diamonds: state.diamonds,
        energy: state.energy,
        balanceUZS: state.balanceUZS,
        referralCode: state.referralCode,
        referralStats: state.referralStats,
        ownedSkins: state.ownedSkins,
        selectedSkin: state.selectedSkin,
        dailyBonusCode: state.dailyBonusCode,
        dailyBonusReward: state.dailyBonusReward,
        wheelRotation: state.wheelRotation,
      };
      const json = JSON.stringify(coreData);
      if(json.length < 4000){
        cloud.setItem(CLOUD_KEY, json, ()=>{});
      }
    }
  } catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    Object.keys(data).forEach(k=>{ state[k] = data[k]; });
    const FAKE_SELLERS = ['Samandar','z1rak_12k','Husanboy'];
    if(Array.isArray(state.p2pListings)){
      state.p2pListings = state.p2pListings.filter(l => !(FAKE_SELLERS.includes(l.seller) && ['p1','p2','p3'].includes(l.id)));
    }
  } catch(e){}
}
function loadFromCloud(){
  try{
    const cloud = getCloudStorage();
    if(!cloud) return;
    cloud.getItem(CLOUD_KEY, (err, value)=>{
      if(err || !value) return;
      try{
        const data = JSON.parse(value);
        Object.keys(data).forEach(k=>{ state[k] = data[k]; });
        render();
      } catch(e){}
    });
  } catch(e){}
}
let saveTimer = null;
function scheduleSave(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 600);
}

/* ============ HELPERS ============ */
function fmtCoin(n){
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(n);
}
function refreshHeader(){
  document.getElementById('coinCount').textContent = fmtCoin(Math.floor(state.coins));
  document.getElementById('diamondCount').textContent = state.diamonds;
}
function toast(msg){
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  document.getElementById('app').appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
function badgeClass(s){ return s==='done'?'done':s==='processing'?'processing':'canceled'; }
function badgeLabel(s){ return s==='done'?'BAJARILDI':s==='processing'?'PROCESSING':'CANCELED'; }

/* ============ NAV ============ */
function setTab(tab){
  currentTab = tab;
  state.screenStack = [];
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active', n.dataset.tab===tab));
  render();
  if(tab==='tasks') refreshSharedTasks();
  if(tab==='auction') refreshAuctions();
}
function pushScreen(name, ctx){
  state.screenStack.push({name, ctx});
  render();
  if(name==='admin') refreshAuctions();
}
function popScreen(){
  state.screenStack.pop();
  render();
}

/* ============ RENDER ROOT ============ */
function render(){
  saveState();
  refreshHeader();
  document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active', n.dataset.tab===currentTab));
  const c = document.getElementById('content');
  const top = state.screenStack[state.screenStack.length-1];
  if(top){ c.innerHTML = renderSubScreen(top); attachSubHandlers(top); return; }

  if(currentTab==='boost') c.innerHTML = renderBoost();
  else if(currentTab==='tasks') c.innerHTML = renderTasks();
  else if(currentTab==='tap') c.innerHTML = renderTap();
  else if(currentTab==='auction') c.innerHTML = renderAuction();
  else if(currentTab==='profile') c.innerHTML = renderProfile();

  updateTaskDot();
}
function updateTaskDot(){
  const now = Date.now();
  const anyUnclaimed = state.taskList.some(t=> t.recurring ? (t.nextAt<=now) : !t.claimed);
  document.getElementById('taskDot').style.display = anyUnclaimed ? 'block':'none';
}

function renderTasks(){

  `;

function setTaskSub(v){ state.taskSub=v; render(); }

function renderTasksMavjud(){
  const rows = state.taskList.map(t=>{
    if(t.kind==='referral'){
      return `
      <div class="row-card" onclick="pushScreen('referral-invite')">
        <div class="row-icon">${t.icon}</div>
        <div class="row-body">
          <div class="row-title">Do'stlar</div>
          <div class="row-reward">+${t.reward} 💎 har bir taklif uchun ${state.referralStats.invited>0 ? '· '+state.referralStats.invited+' ta taklif qilindi' : ''}</div>
        </div>
        <button class="btn btn-gold">Taklif qilish</button>
      </div>`;
    }
    if(t.recurring){
      const now = Date.now();
      const remainingMs = t.nextAt - now;
      const ready = remainingMs <= 0;
      const secs = Math.max(0, Math.ceil(remainingMs/1000));
      return `
      <div class="row-card" onclick="claimTask('${t.id}')">
        <div class="row-icon">${t.icon}</div>
        <div class="row-body">
          <div class="row-title">${t.title}</div>
          <div class="row-reward">+${t.reward} 💎</div>
        </div>
        <button class="btn ${ready?'btn-gold':'btn-dark'}" ${ready?'':'disabled'} data-countdown="${t.id}">${ready?"OLISH":secs+'s'}</button>
      </div>`;
    }
    return '';
  }).join('');

  const sharedRows = state.sharedTasks.map(t=>`
      <div class="row-card" onclick="claimSharedTask('${t.id}')">
        <div class="row-icon">✈️</div>
        <div class="row-body">
          <div class="row-title">${t.title}</div>
          <div class="row-reward">+${t.reward} 💎 · qoldi ${t.remaining} 💎</div>
        </div>
        <button class="btn ${t.claimed?'btn-dark':'btn-dark'}" ${t.claimed?'disabled':''}>${t.claimed?"OLINDI":"O'TISH"}</button>
      </div>`).join('');

  const sharedSection = `
    <div class="section-title" style="padding-top:0;">HAMMAGA KO'RINADIGAN VAZIFALAR</div>
    ${sharedRows || `<div class="empty-note">Hozircha umumiy vazifalar yo'q</div>`}
  `;

  return rows + sharedSection;
}
async function refreshSharedTasks(){
  if(SERVER_URL.includes('YOUR-SERVER')) return; // hali serverga ulanmagan
  try{
    state.sharedTasks = await serverApi('GET','/api/tasks');
    render();
  }catch(e){ console.error('Umumiy vazifalarni yuklashda xatolik:', e); }
}
async function claimSharedTask(id){
  const t = state.sharedTasks.find(x=>x.id===id);
  if(!t || t.claimed) return;
  window.open(t.link, '_blank');
  try{
    const res = await serverApi('POST', `/api/tasks/${id}/claim`);
    state.diamonds += res.reward;
    t.claimed = true;
    toast(`Havolaga kirdingiz · +${res.reward} 💎`);
    render();
    refreshSharedTasks();
  }catch(e){
    const err = e.data && e.data.error;
    const messages = { already_claimed:"Bu vazifani allaqachon bajargansiz", pool_empty:"Vazifa uchun mablag' tugagan" };
    toast(messages[err] || "Server bilan bog'lanib bo'lmadi");
  }
}
function startTaskCountdownTick(){
  setInterval(()=>{
    if(currentTab==='tasks' && state.screenStack.length===0 && state.taskSub==='mavjud'){
      render();
    }
    if(currentTab==='auction' && state.screenStack.length===0){
      render();
    }
    const top = state.screenStack[state.screenStack.length-1];
    if(top && top.name==='auction-detail'){
      const el = document.getElementById('auctionTimeLeft');
      if(el) el.textContent = formatRemaining(top.ctx.endsAt - Date.now());
    }
  }, 1000);
  let pollCounter = 0;
  setInterval(()=>{
    pollCounter++;
    if(pollCounter % 4 !== 0) return; // taxminan har 4 soniyada
    if(currentTab==='tasks') refreshSharedTasks();
    if(currentTab==='auction'){
      refreshAuctions().then(()=>{
        const top = state.screenStack[state.screenStack.length-1];
        if(top && top.name==='auction-detail'){
          const fresh = [...state.auctions.faol, ...state.auctions.tugagan].find(a=>a.id===top.ctx.id);
          if(fresh) top.ctx = fresh;
        }
      });
    }
  }, 1000);
}
function claimTask(id){
  const t = state.taskList.find(x=>x.id===id);
  if(!t) return;
  if(t.recurring){
    const now = Date.now();
    if(now < t.nextAt){
      const secs = Math.ceil((t.nextAt-now)/1000);
      toast(`Yana ${secs} soniyadan keyin oling`);
      return;
    }
    state.diamonds += t.reward;
    t.nextAt = now + t.cooldown*1000;
    toast(`+${t.reward} 💎 qo'shildi!`);
    render();
    return;
  }
}

function calcTaskPrice(){
  const amt = Number(document.getElementById('ytAmount').value)||0;
  document.getElementById('taskPriceLabel').textContent = amt + ' ta';
  document.getElementById('taskPriceSub').textContent = amt + ' diamond';
}
function submitTask(){
  const uname = document.getElementById('ytUsername').value.trim();
  const amt = Number(document.getElementById('ytAmount').value)||0;
  const REWARD = 5;
  if(!uname){ toast("Username kiriting"); return; }
  if(amt < REWARD){ toast(`Kamida ${REWARD} olmos ajrating`); return; }
  if(state.diamonds < amt){ toast("Yetarli olmos yo'q"); return; }
  state.diamonds -= amt;
  const link = uname.startsWith('http') ? uname : 'https://t.me/' + uname.replace('@','');
  state.taskList.unshift({id:'custom'+Date.now(), title:uname, icon:'✈️', reward:REWARD, remaining:amt, claimed:false, kind:'telegram', link});
  toast("Vazifa joylandi! Har bir bajargan foydalanuvchiga 5 💎 beriladi");
  state.taskSub = 'mavjud';
  render();
}

}

function buySkin(id){
  const s = SKINS.find(x=>x.id===id);
  if(!s) return;
  if(state.ownedSkins.includes(id)){ toast("Bu belgi allaqachon sizda bor"); return; }
  if(!tierUnlocked(s.tier)){ toast("Avval oldingi darajadagi hamma belgilarni yig'ing"); return; }
  if(state.diamonds < s.price){ toast("Olmos yetarli emas"); return; }
  state.diamonds -= s.price;
  state.ownedSkins.push(id);
  state.selectedSkin = id;
  state.energy = s.cap;
  toast(`${s.name} sotib olindi va faollashtirildi!`);
  render();
}
function selectSkin(id){
  if(!state.ownedSkins.includes(id)) return;
  const s = SKINS.find(x=>x.id===id);
  state.selectedSkin = id;
  if(s) state.energy = Math.min(state.energy, s.cap);
  toast("Belgi almashtirildi!");
  render();
}

function promptEnergyRefill(){
  const skin = currentSkin();
  showModal(`

function refillEnergy(){
  if(state.diamonds < ENERGY_REFILL_COST){ toast("Yetarli olmos yo'q"); closeModal(); return; }
  state.diamonds -= ENERGY_REFILL_COST;
  state.energy = currentSkin().cap;
  toast(`Energiya to'ldirildi · -${ENERGY_REFILL_COST} 💎`);
  closeModal();
  render();
}
function doTap(ev){
  const skin = currentSkin();
  const power = skin.multiplier;
  if(state.energy < power){ promptEnergyRefill(); return; }
  state.energy -= power;
  state.coins += power;
  refreshHeader();
  document.querySelector('.balance-big .num').textContent = Math.floor(state.coins).toLocaleString();
  document.querySelector('.energy-val').innerHTML = Math.floor(state.energy)+'<span style="color:var(--text-faint); font-weight:600;">/'+skin.cap+'</span>';
  document.querySelector('.energy-bar').style.width = (state.energy/skin.cap*100)+'%';
  scheduleSave();

  const coinEl = document.getElementById('coinBig');
  coinEl.style.transform='scale(0.92)';
  setTimeout(()=>coinEl.style.transform='scale(1)', 90);

  const pop = document.createElement('div');
  pop.className='float-pop';
  pop.textContent = '+'+power;
  const rect = document.getElementById('coinStage').getBoundingClientRect();
  const x = (ev.clientX - rect.left) || 140;
  const y = (ev.clientY - rect.top) || 140;
  pop.style.left = x+'px'; pop.style.top = y+'px';
  document.getElementById('coinStage').appendChild(pop);
  setTimeout(()=>pop.remove(), 800);
}

function formatRemaining(ms){
  if(ms<=0) return "Yakunlangan";
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

const TASK_ACTION_LABELS = {
  'ig-view':  { icon:'📸', verb:'Instagram post ko\'rish' },
  'ig-share': { icon:'📸', verb:'Instagram post ulashish' },
  'ig-sub':   { icon:'📸', verb:'Instagram\'da obuna bo\'lish' },
  'ig-like':  { icon:'📸', verb:'Instagram post\'ga layk bosish' },
  'tg-view':  { icon:'✈️', verb:'Telegram post ko\'rish' },
  'tg-react': { icon:'✈️', verb:'Telegram post\'ga reaksiya qo\'yish' },
  'tg-sub':   { icon:'✈️', verb:'Telegram kanalga obuna bo\'lish' },
};
function normalizeBoostLink(serviceId, link){
  if(link.startsWith('http')) return link;
  const clean = link.replace('@','');
  if(serviceId.startsWith('tg-')) return 'https://t.me/' + clean;
  if(serviceId.startsWith('ig-')) return 'https://instagram.com/' + clean;
  return link;
}
async function confirmBoost(s){
  const link = document.getElementById('bLink').value.trim();
  if(!link){ toast("Havola yoki username kiriting"); return; }
  if(!selectedBoostQty || selectedBoostQty<=0){ toast("Miqdorni tanlang"); return; }
  const price = Math.round(s.diamondPer100 * selectedBoostQty/100);
  if(price<=0){ toast("Miqdorni tanlang"); return; }
  if(state.diamonds < price){ toast("Olmos yetarli emas"); return; }
  state.diamonds -= price;

  // 1) AI orqali — HAQIQIY buyurtma, SMM panel orqali (serverdagi maxfiy API kalit bilan)
  try{
    const res = await serverApi('POST','/api/boost-order', { serviceId: s.id, link, quantity: selectedBoostQty });
    state.orders.unshift({id:res.orderId || String(Math.floor(Math.random()*900000+100000)), title:s.title, status:'processing', amount:price, holat:'SMM panel orqali bajarilmoqda', detail:`${selectedBoostQty} ta · ${link}`, progress:5});
  }catch(e){
    toast("Haqiqiy buyurtma yuborilmadi — server yoki xizmat ID muammosi bo'lishi mumkin");
  }

  // 2) Odamlar orqali — HAMMAGA ko'rinadigan umumiy vazifa (serverda saqlanadi)
  const action = TASK_ACTION_LABELS[s.id] || { icon:'✈️', verb:s.title };
  const normalizedLink = normalizeBoostLink(s.id, link);
  const perPersonReward = Math.max(1, Math.round(price / selectedBoostQty));
  try{
    await serverApi('POST','/api/tasks', {
      title: `${action.verb}: ${link}`,
      link: normalizedLink,
      reward: perPersonReward,
      remaining: price
    });
    toast(`Buyurtma qabul qilindi — hammaga ko'rinadigan vazifa yaratildi (≈${selectedBoostQty} kishiga, har biriga ${perPersonReward} 💎)`);
    refreshSharedTasks();
  } catch(e){
    toast("Vazifa serverga qo'shilmadi — server ulanmagan bo'lishi mumkin");
  }
  selectedBoostQty = 0;
  setTab('tasks');
}

/* ============ OLMOS BARABANI (DIAMOND WHEEL) ============ */
const WHEEL_COST = 4000;
const WHEEL_SEGMENTS = [
  {value:10, weight:25}, {value:20, weight:20}, {value:30, weight:15}, {value:40, weight:12},
  {value:50, weight:10}, {value:100, weight:8}, {value:200, weight:5}, {value:300, weight:3},
  {value:500, weight:1.5}, {value:1000, weight:0.4}, {value:9999, weight:0.1},
];
let wheelBusy = false;

function polarToCartesian(cx,cy,r,angleDeg){
  const a = (angleDeg-90)*Math.PI/180;
  return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
}
function buildWheelSVG(){
  const n = WHEEL_SEGMENTS.length;
  const seg = 360/n;
  const cx=150, cy=150, r=138;
  let paths = '', labels = '';
  WHEEL_SEGMENTS.forEach((s,i)=>{
    const start = i*seg, end = (i+1)*seg;
    const p1 = polarToCartesian(cx,cy,r,end);
    const p2 = polarToCartesian(cx,cy,r,start);
    const d = `M ${cx} ${cy} L ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} A ${r} ${r} 0 0 1 ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} Z`;
    paths += `<path d="${d}" fill="${i%2===0?'#7c3aed':'#14b8a6'}" stroke="#1a0f2e" stroke-width="2"/>`;
    const mid = start + seg/2;
    const lp = polarToCartesian(cx,cy,r-40,mid);
    labels += `<g transform="rotate(${mid.toFixed(2)} ${lp.x.toFixed(2)} ${lp.y.toFixed(2)})">
      <text x="${lp.x.toFixed(2)}" y="${lp.y.toFixed(2)}" fill="#fff" font-size="14" font-weight="800" text-anchor="middle" font-family="Sora">${s.value}</text>
      <text x="${lp.x.toFixed(2)}" y="${(lp.y+15).toFixed(2)}" text-anchor="middle" font-size="13">💎</text>
    </g>`;
  });
  return `<svg viewBox="0 0 300 300" style="width:100%; height:100%; display:block;">
    <circle cx="150" cy="150" r="146" fill="#1a0f2e" stroke="#f0b93d" stroke-width="4"/>
    ${paths}${labels}
    <circle cx="150" cy="150" r="44" fill="url(#wheelCenterGrad)" stroke="#f0b93d" stroke-width="3"/>
    <defs><radialGradient id="wheelCenterGrad" cx="35%" cy="30%"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#5b21b6"/></radialGradient></defs>
    <text x="150" y="155" text-anchor="middle" fill="#fff" font-size="15" font-weight="800" font-family="Sora">Yumi</text>
  </svg>`;
}
function wheelBackgroundArt(){
  const palettes = [ {a:'#7c3aed', b:'#1e1b4b'}, {a:'#db2777', b:'#3b0764'}, {a:'#0891b2', b:'#1e1b4b'}, {a:'#9333ea', b:'#0f172a'} ];
  const p = palettes[Math.floor(Math.random()*palettes.length)];
  return `<svg viewBox="0 0 200 110" style="position:absolute; top:0; left:0; width:100%; height:100px; opacity:0.6;">
    <defs><linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${p.a}"/><stop offset="100%" stop-color="${p.b}"/>
    </linearGradient></defs>
    <rect width="200" height="110" fill="url(#skyG)"/>
    <polygon points="18,110 28,55 44,85 54,35 68,110" fill="#00000055"/>
    <polygon points="118,110 133,45 148,80 163,25 183,110" fill="#00000044"/>
    <circle cx="158" cy="22" r="13" fill="#fff8dc" opacity="0.85"/>
    <circle cx="35" cy="16" r="1.6" fill="#fff"/><circle cx="78" cy="10" r="1.3" fill="#fff"/>
    <circle cx="128" cy="8" r="1.6" fill="#fff"/><circle cx="178" cy="18" r="1.3" fill="#fff"/>
  </svg>`;
}
function subWheel(){
  return `
    ${subHeader('Olmos barabani')}
    <div style="position:relative; margin:0 16px 16px; border-radius:24px; overflow:hidden; background:radial-gradient(ellipse at 50% 15%, #2d1b4e, #0d0618 75%); padding:22px 16px 20px; text-align:center;">
      ${wheelBackgroundArt()}
      <div style="position:relative; width:250px; height:250px; margin:14px auto 0;">
        <div style="position:absolute; top:-13px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:13px solid transparent; border-right:13px solid transparent; border-top:20px solid #f0b93d; z-index:5; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4));"></div>
        <div id="wheelDisk" style="width:100%; height:100%; transition: transform 4.2s cubic-bezier(.17,.67,.16,1); transform:rotate(${state.wheelRotation||0}deg);">
          ${buildWheelSVG()}
        </div>
      </div>
      <div style="margin-top:16px; display:inline-flex; align-items:center; gap:8px; background:rgba(0,0,0,0.4); padding:8px 18px; border-radius:100px; border:1px solid rgba(240,185,61,0.3);">
        <span style="color:var(--gold); font-weight:800;">🟡 ${WHEEL_COST.toLocaleString()} har bir aylanish uchun</span>
      </div>
    </div>
    <button class="btn btn-gold btn-full" style="margin:0 16px; width:calc(100% - 32px);" id="spinBtn" onclick="spinWheel()">AYLANTIRISH</button>
  `;
}
function spinWheel(){
  if(wheelBusy) return;
  if(state.coins < WHEEL_COST){ toast("Tanga yetarli emas"); return; }
  wheelBusy = true;
  state.coins -= WHEEL_COST;
  refreshHeader();

  const totalWeight = WHEEL_SEGMENTS.reduce((s,x)=>s+x.weight,0);
  let r = Math.random()*totalWeight, idx = 0;
  for(let i=0;i<WHEEL_SEGMENTS.length;i++){
    if(r < WHEEL_SEGMENTS[i].weight){ idx=i; break; }
    r -= WHEEL_SEGMENTS[i].weight;
  }
  const seg = 360/WHEEL_SEGMENTS.length;
  const targetMid = idx*seg + seg/2;
  const currentRotation = state.wheelRotation||0;
  const newRotation = currentRotation + 5*360 + (360 - (targetMid % 360));
  state.wheelRotation = newRotation;

  const wheelEl = document.getElementById('wheelDisk');
  const btn = document.getElementById('spinBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Aylanmoqda...'; }
  if(wheelEl) wheelEl.style.transform = `rotate(${newRotation}deg)`;

  setTimeout(()=>{
    const reward = WHEEL_SEGMENTS[idx].value;
    state.diamonds += reward;
    wheelBusy = false;
    toast(`🎉 Siz ${reward} 💎 yutdingiz!`);
    render();
  }, 4300);
}

async function sendDiamond(){
  const code = document.getElementById('recipCode').value.trim().toUpperCase();
  const amt = Number(document.getElementById('sendAmt').value)||0;
  if(!code){ toast("Qabul qiluvchi kodini kiriting"); return; }
  if(amt<=0){ toast("Miqdorni kiriting"); return; }
  if(code === state.referralCode){ toast("O'zingizga yubora olmaysiz"); return; }
  if(state.diamonds < amt){ toast("Yetarli olmos yo'q"); return; }
  try{
    await serverApi('POST','/api/send-diamond', { toReferralCode: code, amount: amt, fromReferralCode: state.referralCode });
    state.diamonds -= amt;
    popScreen();
    showDiamondReceipt(code, amt);
  }catch(e){
    toast("Server bilan bog'lanib bo'lmadi — birozdan keyin qayta urinib ko'ring");
  }
}

async function checkIncomingTransfers(){
  if(SERVER_URL.includes('YOUR-SERVER')) return;
  if(!state.referralCode) return;
  try{
    const list = await serverApi('GET', `/api/transfers/incoming?code=${encodeURIComponent(state.referralCode)}`);
    for(const t of list){
      try{
        await serverApi('POST', `/api/transfers/${t.id}/claim`);
        state.diamonds += t.amount;
        toast(`💎 Sizga ${t.amount} olmos kelib tushdi!`);
      }catch(e){}
    }
    if(list.length) render();
  }catch(e){ /* jim tur, keyingi safar qayta urinamiz */ }
}

  `);
}
function handleDepositScreenshot(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    window.__pendingDepositScreenshot = e.target.result;
    document.getElementById('depUploadLabel').textContent = '✅ Skrinshot yuklandi';
    document.getElementById('depPreview').innerHTML = `<img src="${e.target.result}" style="width:100%;border-radius:12px; margin-top:10px; border:1px solid var(--border);">`;
  };
  reader.readAsDataURL(file);
}
function doDeposit(){
  const amt = Number(document.getElementById('depAmt').value)||0;
  if(amt<=0){ toast("Summani kiriting"); return; }
  if(!window.__pendingDepositScreenshot){ toast("Chek skrinshotini yuklang"); return; }
  state.depositRequests.unshift({
    id: 'dep'+Date.now(),
    amount: amt,
    screenshot: window.__pendingDepositScreenshot,
    status: 'pending',
    user: (document.getElementById('handleText').textContent || 'Foydalanuvchi'),
    time: new Date().toLocaleString('uz-UZ')
  });
  window.__pendingDepositScreenshot = null;
  toast("So'rovingiz yuborildi — admin tasdiqlashini kuting");
  closeModal();
  render();
}

function showModal(html){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';

  bg.onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };
  bg.innerHTML = `<div class="modal-sheet">${html}</div>`;
  document.getElementById('app').appendChild(bg);
}
function closeModal(){
  const m = document.getElementById('modalBg');
  if(m) m.remove();
  refreshHeader();
}

/* ============ AI FULFILLMENT SIMULATION ============ */
function startAiFulfillment(){
  setInterval(()=>{
    let changed = false;
    state.orders.forEach(o=>{
      if(o.status==='processing'){
        o.progress = Math.min(100, o.progress + Math.floor(Math.random()*12)+4);
        if(o.progress>=100){
          o.status = 'done';
          o.holat = 'Yakunlandi';
        }
        changed = true;
      }
    });
    if(changed){
      scheduleSave();
      if(currentTab==='profile' && state.screenStack.some(s=>s.name==='orders')) render();
    }
  }, 4000);
}

/* ============ TELEGRAM USER ============ */
function initTelegramUser(){
  const ADMIN_USERNAMES = ['uzalma1','uzalmaz1'];
  let startParam = null;
  try{
    const tg = window.Telegram && window.Telegram.WebApp;
    if(tg){
      tg.ready();
      tg.expand && tg.expand();
      startParam = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || null;
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if(u){
        const handle = u.username ? '@'+u.username : [u.first_name, u.last_name].filter(Boolean).join(' ');
        document.getElementById('handleText').textContent = handle || 'Foydalanuvchi';
        state.myUsername = handle || 'Foydalanuvchi';
        const avatarEl = document.getElementById('userAvatar');
        if(u.photo_url){
          avatarEl.innerHTML = `<img src="${u.photo_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        } else {
          avatarEl.textContent = (u.first_name ? u.first_name[0] : (u.username ? u.username[0] : '👤')).toUpperCase();
        }
        if(u.username && ADMIN_USERNAMES.includes(u.username.toLowerCase())){
          state.isAdmin = true;
          if(currentTab==='profile' && state.screenStack.length===0) render();
        }
      }
    }
  } catch(e){}
  if(!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user)){
    document.getElementById('handleText').textContent = 'Telegram orqali kiring';
  }
  runOnboarding(startParam);
}
function runOnboarding(startParam){
  if(state.onboardingDone) return;
  state.onboardingDone = true;
  if(startParam && startParam !== state.referralCode){
    state.referredByCode = startParam;
    saveState();
    toast(`Taklif kodi qabul qilindi: ${startParam}`);
    return;
  }
  saveState();
}
